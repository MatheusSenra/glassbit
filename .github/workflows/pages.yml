name: Pages

# Builds the web frontend and publishes it to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer deployment replaces one still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm
        run: wasm-pack build crates/web --target web --out-dir www/pkg
      - uses: actions/configure-pages@v5
      # crates/web/www is the whole site: static files plus the wasm package.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/web/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
