name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Missing test ROMs must fail the build instead of skipping tests.
      GLASSBIT_REQUIRE_TEST_ROMS: 1
    steps:
      - uses: actions/checkout@v5
      # The toolchain, components and wasm target come from rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cache test ROMs
        uses: actions/cache@v4
        with:
          path: test-roms
          key: test-roms-${{ hashFiles('scripts/fetch-test-roms.sh') }}
      - name: Fetch test ROMs
        run: bash scripts/fetch-test-roms.sh
      - name: Test
        run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm
        run: wasm-pack build crates/web --target web --out-dir www/pkg
