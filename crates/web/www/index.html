<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glassbit</title>
    <meta name="description" content="A Game Boy emulator that shows how the hardware works." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img src="logo.png" alt="Glassbit: transparent emulation" width="375" height="114" />
    </header>

    <main>
      <div id="screen-frame">
        <canvas id="screen" width="160" height="144" tabindex="0" aria-label="Game Boy screen"></canvas>
        <div id="drop-hint" hidden>Drop the ROM to load it</div>
      </div>

      <p id="status" role="status">Loading…</p>

      <div id="controls">
        <label class="button" for="rom-input">Open ROM…</label>
        <input id="rom-input" type="file" accept=".gb,.gbc,application/octet-stream" hidden />
        <button id="pause" type="button">Pause</button>
        <button id="demo" type="button">Demo</button>
      </div>

      <table id="keys">
        <caption>Keyboard</caption>
        <tr><th>Arrow keys</th><td>Direction pad</td></tr>
        <tr><th>X</th><td>A</td></tr>
        <tr><th>Z</th><td>B</td></tr>
        <tr><th>Enter</th><td>Start</td></tr>
        <tr><th>Shift</th><td>Select</td></tr>
      </table>

      <p class="note">
        ROMs are read by your browser and never uploaded. Only ROM-only and
        small MBC1 cartridges work for now.
      </p>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
