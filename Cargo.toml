[workspace]
resolver = "2"
members = ["crates/core", "crates/web", "crates/runner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MatheusSenra/glassbit"
rust-version = "1.80"

[workspace.dependencies]
glassbit-core = { path = "crates/core", version = "0.1.0" }
wasm-bindgen = "0.2"
serde_json = "1"
png = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests run whole test ROMs and half a million CPU vectors: optimize them,
# keeping the overflow and debug assertions of a dev build.
[profile.test]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
